name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          # ═══════════════════════════════════════════════════════════════
          # DESCARGA BLINDADA: el CI recibió una vez un archivo que NO era
          # un ZIP ("Archive is not a ZIP archive" → step muerto → build
          # perdido). Defensa en 3 capas: (1) cadena de versiones — si la
          # CDN sirve corrupto un build number exacto, cae al siguiente;
          # (2) firma ZIP (magic bytes PK) ANTES de confiar; (3) unzip -t
          # valida la integridad completa. Reintentos por versión.
          # ═══════════════════════════════════════════════════════════════
          ok=0
          for ver in 15859902 13114758 9477386; do
            for intento in 1 2; do
              URL="https://dl.google.com/android/repository/commandlinetools-linux-${ver}_latest.zip"
              echo "→ descargando cmdline-tools ${ver} (intento ${intento})…"
              curl -fSL --connect-timeout 20 --max-time 600 -o cmdtools.zip "$URL" || { echo "   curl falló"; sleep 5; continue; }
              if ! head -c 2 cmdtools.zip | grep -q PK; then echo "   NO es un ZIP (firma inválida), reintentando…"; sleep 5; continue; fi
              if ! unzip -tq cmdtools.zip >/dev/null 2>&1; then echo "   ZIP corrupto (unzip -t falló), reintentando…"; sleep 5; continue; fi
              echo "   OK — ${ver} ($(du -h cmdtools.zip | cut -f1)) integridad verificada"
              ok=1; break 2
            done
          done
          [ "$ok" = "1" ] || { echo "✗ ninguna descarga produjo un ZIP válido"; exit 1; }
          unzip -q cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          # sdkmanager también es red → un intento de gracia si falla.
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest" || {
            echo "   sdkmanager falló — reintento único…"; sleep 10
            yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"
          }
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          node -v
          bun --version
          echo "=== package.json exists? ==="
          ls -la package.json
          echo "=== bun.lock exists? ==="
          ls -la bun.lock

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./db/custom.db"
        run: bunx prisma generate

      - name: Build web (Next.js static export)
        env:
          DATABASE_URL: "file:./db/custom.db"
        run: |
          # output:export no admite rutas force-dynamic (/api/*). En el APK las
          # APIs no se sirven (webDir estático) y el cliente ya gestiona los
          # fallos de fetch — se excluyen del árbol durante el export.
          mv src/app/api /tmp/api-routes-backup
          bun run build:static; RC=$?
          mv /tmp/api-routes-backup src/app/api
          exit $RC

      - name: Sync Capacitor
        run: bunx @capacitor/cli sync android

      - name: Build Signed Release APK
        working-directory: android
        run: |
          # FIRMA ESTABLE + versionCode monótono (run number): las versiones
          # nuevas se instalan ENCIMA de la instalada SIN desinstalar → el
          # progreso (localStorage del WebView) se conserva siempre.
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guerrero-tactico-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
